name: Build APK

# 推 v* 形式的 tag 就出包并挂到 Release；也可以手动跑（只出 artifact）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  APK_DIR: android/app/build/outputs/apk/debug

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform 34
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --console=plain --stacktrace

      # 包名和版本号对不上就别发，宁可失败也不要发出标题和内容不一致的包。
      - name: Check APK version against the tag
        id: meta
        run: |
          set -euo pipefail
          AAPT="$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          APK="$APK_DIR/app-debug.apk"
          test -f "$APK" || { echo "no APK at $APK" >&2; exit 1; }

          badging="$("$AAPT" dump badging "$APK" | head -1)"
          code="$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<<"$badging")"
          name="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$badging")"
          echo "built: versionCode=$code versionName=$name"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "$tag" != "$name" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match versionName $name" \
                   "(bump versionName in android/app/build.gradle.kts)"
              exit 1
            fi
            out="PiBlue-$tag-debug.apk"
          else
            out="PiBlue-manual-${GITHUB_SHA::7}-debug.apk"
          fi

          echo "apk=$out" >> "$GITHUB_OUTPUT"
          echo "version=$name" >> "$GITHUB_OUTPUT"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"

          mv "$APK" "$out"
          sha256sum "$out" > "$out.sha256"
          ls -lh "$out"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: piblue-debug-apk
          path: |
            PiBlue-*.apk
            PiBlue-*.apk.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PiBlue-*.apk
            PiBlue-*.apk.sha256
          generate_release_notes: true
          body: |
            自动构建的调试包，可直接安装：
            ```bash
            adb install -r ${{ steps.meta.outputs.apk }}
            ```

            versionCode ${{ steps.meta.outputs.version_code }} ·
            versionName ${{ steps.meta.outputs.version }} · 校验值见 `.sha256` 文件。
